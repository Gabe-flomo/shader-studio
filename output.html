<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playfield output</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #e6e7ec; cursor: none; }
      body.editing { cursor: crosshair; }
      #host { position: fixed; inset: 0; z-index: 0; }
      #host iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      #warp, #handles { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #warp { z-index: 1; }
      #handles { z-index: 2; }
      #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; max-width: 440px; padding: 18px 22px; border-radius: 12px; background: #15161cee; box-shadow: 0 0 0 1px #2a2c36; text-align: center; }
      #status[hidden] { display: none; }
      #status b { display: block; font-size: 15px; margin-bottom: 6px; }
      #hint { position: fixed; left: 16px; bottom: 14px; z-index: 3; padding: 6px 10px; border-radius: 8px; background: #15161ccc; color: #b9bcc8; font-size: 12px; pointer-events: none; }
      #hint[hidden] { display: none; }
      kbd { font: 11px ui-monospace, Menlo, monospace; padding: 1px 5px; border-radius: 4px; background: #2a2c36; color: #e6e7ec; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <canvas id="warp"></canvas>
    <canvas id="handles"></canvas>
    <div id="status"><b>Playfield output</b><span id="status-text">Waiting for Playfield…</span></div>
    <div id="hint" hidden></div>
    <script type="module" src="/src/output/outputPage.ts"></script>
  </body>
</html>
