[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
ffmpeg-sidecar = "2"
# Fetching data from a link (the Data editor): https, no cookies, capped.
ureq = "3"
base64 = "0.22"
# Watching the workspace folder for changes made outside the app.
notify = "8"
# The Kaggle API key, in the system keychain.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
